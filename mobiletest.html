<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mobile test</title>
<style>
	body { margin: 0; background: #333; }
	#frame { border: 0; width: 390px; height: 844px; display: block; }
	#frame.scrolled { height: 3000px; }
</style>
</head>
<body>
<iframe id="frame" title="mobile"></iframe>
<script>
	var frame = document.getElementById('frame');
	var q = new URLSearchParams(location.search);
	frame.src = q.get('page') || 'main.html';
	frame.addEventListener('load', function () {
		var win = frame.contentWindow;
		var doc = win.document;
		if (q.get('scroll')) {
			var el = doc.querySelector(q.get('scroll'));
			if (el) { el.scrollIntoView(); }
		}
		var tries = 0;
		var timer = setInterval(function () {
			tries++;
			var btn = doc.querySelector('.nav-hamburger');
			if (btn) {
				clearInterval(timer);
				if (q.get('open') === '1') {
					btn.click();
					if (q.get('works') === '1') {
						setTimeout(function () {
							var t = doc.querySelector('.mobile-nav-works-toggle');
							if (t) { t.click(); }
							win.document.title = 'opened';
						}, 600);
					} else {
						win.document.title = 'opened';
					}
				} else {
					win.document.title = 'loaded';
				}
			} else if (tries > 40) {
				clearInterval(timer);
				win.document.title = 'no-hamburger';
			}
		}, 250);
	});
</script>
</body>
</html>
