<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mobile viewport test (temporary)</title>
<style>
	body { margin: 0; background: #333; font: 12px sans-serif; color: #fff; }
	iframe { width: 390px; height: 844px; border: 1px solid #000; background: #fff; display: block; }
</style>
</head>
<body>
	<p id="status">loading…</p>
	<iframe id="f"></iframe>
	<script>
		var q = new URLSearchParams(location.search);
		var f = document.getElementById('f');
		f.src = q.get('page') || 'main.html';
		f.onload = function () {
			var sel = q.get('scroll');
			if (sel) {
				setTimeout(function () {
					var doc = f.contentDocument;
					var el = doc.querySelector(sel);
					if (el) { f.contentWindow.scrollTo(0, el.getBoundingClientRect().top + f.contentWindow.scrollY - 20); }
					document.getElementById('status').textContent = 'scrolled to ' + sel;
				}, 2500);
			} else {
				document.getElementById('status').textContent = 'loaded ' + f.src;
			}
		};
	</script>
</body>
</html>
